[workspace]
resolver = "2"
members = [
	"hexagon_launcher",
	"protostar",
	"protostar-launcher",
	"single",
	"sirius",
]

metadata.crane.name = "protostar"

# this should only be applied to clients, not libraries (unless they want to follow the main stardust version)
[workspace.package]
version = "0.53.0-rc.1"

[workspace.dependencies]
tokio = { version = "1.47.1", features = ["rt", "tokio-macros", "sync"] }
serde = "1.0.219"

[workspace.dependencies.stardust-xr-fusion]
version = "0.53.0-rc.1"
# git = "https://github.com/StardustXR/core.git"

[workspace.dependencies.stardust-xr-molecules]
version = "0.53.0-rc.1"
# git = "https://github.com/StardustXR/molecules.git"

[workspace.dependencies.stardust-xr-asteroids]
version = "0.53.0-rc.1"
# git = "https://github.com/StardustXR/asteroids.git"
